<!--
  The GraphGuard mark. Geometry is duplicated by hand from src/components/Logo.tsx — a React
  component cannot serve as a favicon and a favicon cannot be imported as a component — so if
  one changes, change the other. The path is identical; only the fill differs, because a
  favicon has no `currentColor` to inherit from.

  It is a pinwheel with 4-fold rotational and no mirror symmetry: never flip it.
-->
