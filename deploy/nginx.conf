# Reverse proxy for GraphGuard.
#
# Serves the built dashboard as static files and forwards /api to the backend, so
# the browser sees one origin and no CORS preflight is needed in production.
#
# TLS is not configured here. On the VPS this file is paired with a certificate
# obtained by certbot, which rewrites this server block to listen on 443 and adds
# an HTTP redirect. Committing a self-signed certificate would only encourage
# someone to deploy with it.

upstream graphguard_api {
    server api:8000;
}

# Rate limits, defined here rather than in the application because the cheapest
# place to drop a flood is before it reaches Python. The auth zone is tighter:
# /api/auth/login is the credential-stuffing target, and this system exists to
# detect exactly that pattern elsewhere.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version to anyone probing the service.
    server_tokens off;

    client_max_body_size 16m;

    # Baseline security headers. HSTS is deliberately absent until TLS is
    # configured — sending it over plain HTTP would either be ignored or, worse,
    # pin a browser to HTTPS for a host that does not serve it yet.
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://graphguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # auth.client_ip trusts the first entry of X-Forwarded-For. That is only
        # safe because this proxy sets it; the header is attacker-controlled if
        # the API is ever exposed directly.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Long enough for a queued run to be accepted, short enough that a hung
        # upstream frees the connection rather than accumulating sockets.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://graphguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # auth.client_ip trusts the first entry of X-Forwarded-For. That is only
        # safe because this proxy sets it; the header is attacker-controlled if
        # the API is ever exposed directly.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Long enough for a queued run to be accepted, short enough that a hung
        # upstream frees the connection rather than accumulating sockets.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # --- Operational endpoints ---------------------------------------------
    # /metrics carries no secrets but does reveal traffic shape and run cadence,
    # which is reconnaissance. It is reachable only from private ranges; a real
    # deployment scrapes it over the internal network, not the public interface.
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://graphguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # auth.client_ip trusts the first entry of X-Forwarded-For. That is only
        # safe because this proxy sets it; the header is attacker-controlled if
        # the API is ever exposed directly.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Long enough for a queued run to be accepted, short enough that a hung
        # upstream frees the connection rather than accumulating sockets.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # --- Dashboard ---------------------------------------------------------
    # Single-page application: unknown paths fall through to index.html so that
    # client-side routes survive a page refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or a
    # deploy leaves browsers loading a stale app against a new API.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
