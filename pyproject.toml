[project]
name = "graphguard"
version = "0.1.0"
description = "Graph-based security analytics for AI-platform telemetry: heterogeneous temporal graph + graph anomaly detection + analyst dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mohamed Amine Ben Mosbah" }]

dependencies = [
    # --- schema / config ---
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # --- numerics ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # --- graph ---
    "networkx>=3.3",
    "torch>=2.4",
    "torch-geometric>=2.6",
    "pygod>=1.1",
    # --- api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # --- platform: persistence ---
    # SQLAlchemy is used in its 2.0 typed style so the ORM layer passes the same
    # mypy gate as the rest of the codebase. psycopg 3 is the current Postgres
    # driver and supports both sync and async; Alembic gives versioned schema
    # migrations, which a deployed service needs and D6's versioning discipline
    # implies.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # --- platform: auth ---
    # pwdlib is the maintained successor to passlib; argon2id is the OWASP
    # first-choice password hash and the Password Hashing Competition winner.
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    # Backs pydantic's EmailStr, so a malformed address is rejected at the schema
    # boundary rather than becoming an unusable account row.
    "email-validator>=2.2",
    # --- platform: jobs, cache, rate limiting ---
    # A full pipeline run measures ~7 s, which is too slow to hold an HTTP
    # request open, so runs are dispatched to a Celery worker. Redis is the
    # broker, the refresh-token revocation list and the rate-limit store.
    "celery>=5.4",
    "redis>=5.0",
    # --- platform: observability ---
    "prometheus-client>=0.21",
    # --- cli / reporting ---
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx2>=2.9.1",
    # Lets the auth and rate-limit tests run without a live Redis.
    "fakeredis>=2.25",
]
# The analyst assistant's language-model client (platform/assistant.py). Optional so
# the analytics packages and the default deployment carry no LLM dependency; the
# feature is additionally gated behind GRAPHGUARD_ASSISTANT_ENABLED.
assistant = [
    "anthropic>=0.69",
    # The OpenAI-compatible driver (OpenAI itself, or OpenRouter via base URL).
    "openai>=1.50",
]

[project.scripts]
graphguard = "graphguard.cli:app"

# CPU-only torch on Linux. Without this, a Linux `uv sync` resolves the default
# CUDA build and pulls multi-gigabyte GPU wheels into an image that will never
# see a GPU — which is what filled the CI runner's disk and failed every Docker
# build to date. macOS keeps the default wheels (there is no CPU/CUDA split).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphguard"]

# ---------------------------------------------------------------------------
# Tooling (docs/DESIGN.md §13: ruff + black + mypy + pytest)
# ---------------------------------------------------------------------------

# Material that is not ours to lint: the companion Phase 1 research repositories
# copied in for their traces, and peer reports kept for format reference.
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "^/(CSLWork|docs/reference)/"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["CSLWork", "docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = [
    "D100", # module docstring handled per-module by review, not the linter
    "D104", # package docstring
    "D203",
    "D213",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is the FastAPI dependency-injection idiom, not
# the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "graphguard.platform.auth.require_role",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Alembic revision scripts are generated, not authored: they carry no docstrings and
# import `sa`/`Text` whether or not a given revision uses them.
"migrations/versions/*" = ["D", "F401", "E501", "I001", "UP007", "UP035"]
# The embedded triage-page template holds long HTML/JS lines; the Python around it obeys E501.
"src/graphguard/api/app.py" = ["E501"]

[tool.mypy]
# Without this plugin mypy cannot resolve `Field(default_factory=SomeModel)` on pydantic models.
plugins = ["pydantic.mypy"]
python_version = "3.12"
packages = ["graphguard"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
